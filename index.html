<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulateur de Coalition — Assemblée Nationale</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Simulateur de Coalition</h1>
    <p class="subtitle">Assemblée Nationale — 577 sièges</p>
  </header>

  <main>
    <div id="layout">

      <aside id="parties-panel">
        <div id="parties"></div>
      </aside>

      <section id="viz-panel">
        <div id="hemicycle"></div>

        <div id="results">
          <div id="result-row">
            <div class="result-block">
              <span class="result-number" id="total-seats">0</span>
              <span class="result-label">sièges sélectionnés</span>
            </div>
            <div class="result-block">
              <span class="result-number" id="majority-status" class="no-majority">Non</span>
              <span class="result-label">majorité absolue (289)</span>
            </div>
          </div>

          <div id="progress-bar">
            <div id="progress-fill"></div>
            <div id="progress-track-marker" style="left: calc(289/577 * 100%)"></div>
          </div>
          <p id="progress-label"></p>
        </div>
      </section>

    </div>
  </main>

  <footer>
    <p>Créé par <a href="https://aclee.fr" target="_blank">aclee.fr</a></p>
  </footer>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="scripts.js"></script>
</body>
</html>
